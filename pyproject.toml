[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labelfree"
version = "0.1.0"
description = "Neural network for predicting nuclear fluorescence from phase contrast microscopy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "numpy>=1.24.0",
    "scikit-image>=0.21.0",
    "tifffile>=2023.7.0",
    "albumentations>=1.3.0",
    "pyyaml>=6.0",
    "tensorboard>=2.14.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
labelfree = "labelfree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
